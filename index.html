<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠意收藏家 Pro - 雲端版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --emerald-dark: #064e3b;
            --emerald-mid: #065f46;
            --emerald-light: #10b981;
        }
        body {
            background-color: var(--emerald-dark);
            color: #f3f4f6;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
        .emerald-gradient {
            background: linear-gradient(135deg, #065f46 0%, #047857 100%);
        }
        .btn-primary {
            background-color: var(--emerald-light);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #34d399;
            transform: translateY(-2px);
        }
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid var(--emerald-light);
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- 登入遮罩 -->
    <div id="auth-overlay" class="fixed inset-0 bg-emerald-950 z-[200] flex flex-col items-center justify-center p-4">
        <div class="text-center space-y-6 max-w-sm w-full">
            <h1 class="text-4xl font-bold">🌿 綠意收藏家</h1>
            <p class="text-emerald-300 text-sm">歡迎來到專屬您的珍藏管理空間</p>
            
            <div class="space-y-3 pt-4">
                <button id="login-btn" class="w-full bg-white text-gray-900 flex items-center justify-center gap-3 px-6 py-3 rounded-full font-bold text-md shadow-lg hover:bg-gray-100 transition-all">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                    使用 Google 帳號登入
                </button>
                
                <button id="guest-btn" class="w-full bg-emerald-800/50 hover:bg-emerald-800 text-emerald-200 border border-emerald-600/50 flex items-center justify-center gap-3 px-6 py-3 rounded-full font-bold text-md transition-all">
                    🔑 以訪客身分繼續 (使用本地儲存)
                </button>
            </div>

            <div id="login-loading" class="hidden flex justify-center"><div class="loader"></div></div>
        </div>
    </div>

    <!-- 導覽列 -->
    <nav class="sticky top-0 z-50 emerald-gradient shadow-xl p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span class="text-3xl">🌿</span> <span class="hidden sm:inline">綠意收藏家</span>
            </h1>
            <div class="flex gap-4 items-center">
                <button onclick="switchTab('dashboard')" class="hover:text-emerald-300 text-sm">儀表板</button>
                <button onclick="switchTab('collection')" class="hover:text-emerald-300 text-sm">收藏</button>
                <button onclick="switchTab('wishlist')" class="hover:text-emerald-300 text-sm">願望</button>
                
                <!-- 狀態與大頭貼 -->
                <div id="user-profile" class="flex items-center gap-2 border-l border-white/20 pl-4">
                    <span id="storage-mode-badge" class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full">雲端同步中</span>
                    <img id="user-avatar" src="https://via.placeholder.com/150" class="w-8 h-8 rounded-full border border-emerald-400 object-cover">
                    <button onclick="handleLogout()" class="text-xs opacity-70 hover:opacity-100">登出</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto mt-8 px-4">
        <!-- 儀表板區域 -->
        <section id="tab-dashboard" class="tab-content">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="glass-card p-6 flex flex-col items-center justify-center text-center">
                    <h3 class="text-emerald-300 mb-2">平均收藏評分</h3>
                    <div id="avg-rating" class="text-5xl font-bold text-white">0.0</div>
                    <div class="text-yellow-400 mt-2 text-xl" id="avg-stars">☆☆☆☆☆</div>
                </div>
                <div class="glass-card p-6 flex flex-col items-center justify-center text-center">
                    <h3 class="text-emerald-300 mb-2">總收藏價值</h3>
                    <div id="total-value" class="text-4xl font-bold text-white">$0</div>
                </div>
                <div class="glass-card p-6">
                    <h3 class="text-emerald-300 mb-4 text-center">近期願望目標</h3>
                    <div class="relative pt-1">
                        <div id="savings-item-name" class="text-center font-bold mb-2">無</div>
                        <div class="overflow-hidden h-4 mb-4 text-xs flex rounded bg-emerald-900 border border-white/10">
                            <div id="savings-bar" style="width:0%" class="bg-emerald-500 transition-all duration-700"></div>
                        </div>
                        <p id="savings-status" class="text-xs text-center opacity-80">尚無進行中的願望</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                <div class="glass-card p-6 h-[400px]">
                    <h3 class="text-xl font-semibold mb-4">收藏類別分析</h3>
                    <div class="h-72"><canvas id="categoryChart"></canvas></div>
                </div>
                <div class="glass-card p-6 overflow-y-auto max-h-[400px]">
                    <h3 class="text-xl font-semibold mb-4">最新入庫項目</h3>
                    <div id="recent-list" class="space-y-3"></div>
                </div>
            </div>
        </section>

        <!-- 我的收藏 -->
        <section id="tab-collection" class="tab-content hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">📦 我的收藏庫</h2>
                <button onclick="toggleModal('modal-add-item')" class="btn-primary px-4 py-2 rounded-lg font-bold shadow-lg">+ 新增收藏</button>
            </div>
            <div id="collection-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <!-- 願望清單 -->
        <section id="tab-wishlist" class="tab-content hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">✨ 願望清單</h2>
                <button onclick="toggleModal('modal-add-wish')" class="btn-primary px-4 py-2 rounded-lg font-bold shadow-lg">+ 新增願望</button>
            </div>
            <div id="wishlist-container" class="space-y-4"></div>
        </section>
    </main>

    <!-- Modal: 新增收藏 -->
    <div id="modal-add-item" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-[100] p-4">
        <div class="glass-card bg-emerald-900 w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
            <h3 class="text-xl font-bold mb-4">加入新收藏</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-emerald-300">物品照片 (建議小於 500KB)</label>
                    <input type="file" id="item-image" accept="image/*" class="mt-1 text-sm file:bg-emerald-700 file:text-white file:border-none file:rounded file:px-2 file:mr-4">
                    <div id="image-preview" class="mt-2 hidden"><img class="w-full h-32 object-cover rounded border border-white/20"></div>
                </div>
                <input type="text" id="item-name" class="p-2 bg-black/20 text-white w-full rounded border border-white/10" placeholder="物品名稱">
                <div class="grid grid-cols-2 gap-2">
                    <select id="item-category" class="p-2 bg-black/20 text-white rounded border border-white/10">
                        <option value="公仔模型">公仔模型</option>
                        <option value="電子產品">電子產品</option>
                        <option value="書籍/漫畫">書籍/漫畫</option>
                        <option value="其他">其他</option>
                    </select>
                    <input type="number" id="item-price" class="p-2 bg-black/20 text-white rounded border border-white/10" placeholder="購入價值 ($)">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-emerald-300 text-center">評分：<span id="rating-val">3.0</span></label>
                    <input type="range" id="item-rating" min="1" max="5" step="0.5" value="3.0" class="w-full">
                </div>
                <div class="flex gap-2 pt-2">
                    <button onclick="saveItemToFirestore()" id="save-item-btn" class="btn-primary flex-1 py-2 rounded font-bold text-white">確認儲存</button>
                    <button onclick="toggleModal('modal-add-item')" class="bg-gray-600 flex-1 py-2 rounded text-white hover:bg-gray-500">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: 新增願望 -->
    <div id="modal-add-wish" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-[100] p-4">
        <div class="glass-card bg-emerald-900 w-full max-w-md p-6">
            <h3 class="text-xl font-bold mb-4">許下新願望</h3>
            <div class="space-y-4">
                <input type="text" id="wish-name" class="p-2 bg-black/20 text-white w-full rounded border border-white/10" placeholder="想要什麼？">
                <input type="number" id="wish-target" class="p-2 bg-black/20 text-white w-full rounded border border-white/10" placeholder="目標價格 ($)">
                <div class="flex gap-2">
                    <button onclick="saveWishToFirestore()" class="btn-primary flex-1 py-2 rounded font-bold text-white">加入清單</button>
                    <button onclick="toggleModal('modal-add-wish')" class="bg-gray-600 flex-1 py-2 rounded text-white hover:bg-gray-500">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpritUCSkGEyjJg9gYterRnPz4rIeazuQ",
            authDomain: "collect-2aec0.firebaseapp.com",
            projectId: "collect-2aec0",
            storageBucket: "collect-2aec0.firebasestorage.app",
            messagingSenderId: "241828603619",
            appId: "1:241828603619:web:b6a1c115a3d899e00007d6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'emerald-collector-pro';

        let currentUser = null;
        let collectionData = [];
        let wishlistData = [];
        let chartInstance = null;
        let base64Image = "";
        let unsubItems = null;
        let unsubWishes = null;
        let isLocalStorageMode = false; // 是否因規則拒絕等原因自動切換為本地儲存

        const initAuth = async () => {
            const loginBtn = document.getElementById('login-btn');
            const guestBtn = document.getElementById('guest-btn');
            const loading = document.getElementById('login-loading');

            // 1. 註冊登入狀態變化監聽器
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    currentUser = user;
                    document.getElementById('auth-overlay').classList.add('hidden');
                    document.getElementById('user-avatar').src = user.photoURL || 'https://via.placeholder.com/150';
                    
                    if (user.isAnonymous) {
                        updateStorageModeBadge("本地離線模式", "bg-yellow-500/20", "text-yellow-300");
                    } else {
                        updateStorageModeBadge("雲端同步中", "bg-emerald-500/20", "text-emerald-300");
                    }
                    
                    setupListeners();
                } else {
                    currentUser = null;
                    if (unsubItems) unsubItems();
                    if (unsubWishes) unsubWishes();
                    document.getElementById('auth-overlay').classList.remove('hidden');
                    loginBtn.classList.remove('hidden');
                    guestBtn.classList.remove('hidden');
                    loading.classList.add('hidden');
                }
            });

            // 2. Google 登入事件
            loginBtn.addEventListener('click', async () => {
                loginBtn.classList.add('hidden');
                guestBtn.classList.add('hidden');
                loading.classList.remove('hidden');
                try {
                    await signInWithPopup(auth, new GoogleAuthProvider());
                } catch (e) {
                    console.error("Login Error", e);
                    loginBtn.classList.remove('hidden');
                    guestBtn.classList.remove('hidden');
                    loading.classList.add('hidden');
                    alert("Google 登入失敗，請嘗試使用訪客登入！");
                }
            });

            // 3. 訪客登入事件
            guestBtn.addEventListener('click', async () => {
                loginBtn.classList.add('hidden');
                guestBtn.classList.add('hidden');
                loading.classList.remove('hidden');
                try {
                    await signInAnonymously(auth);
                } catch (e) {
                    console.error("Anonymous Sign-In Error", e);
                    // 萬一連匿名登入都連不上（例如完全沒網路），直接切換至本機模式
                    activateLocalStorageMode();
                }
            });

            // 4. 自定義 Token 初始化
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                try { 
                    await signInWithCustomToken(auth, __initial_auth_token); 
                } catch (e) { 
                    try { await signInAnonymously(auth); } catch(err) { activateLocalStorageMode(); }
                }
            }
        };

        const updateStorageModeBadge = (text, bgColor, textColor) => {
            const badge = document.getElementById('storage-mode-badge');
            badge.textContent = text;
            badge.className = `text-[10px] ${bgColor} ${textColor} px-2 py-0.5 rounded-full`;
        };

        // --- 啟用完全本地儲存模式（當 Firebase Rules 報錯時自動啟用） ---
        const activateLocalStorageMode = () => {
            isLocalStorageMode = true;
            console.warn("⚠️ 已安全切換至本地快取儲存模式（LocalStorage）");
            updateStorageModeBadge("本地儲存模式", "bg-orange-500/20", "text-orange-300");
            document.getElementById('auth-overlay').classList.add('hidden');
            
            // 載入本地儲存資料
            collectionData = JSON.parse(localStorage.getItem('emerald_local_items')) || [];
            wishlistData = JSON.parse(localStorage.getItem('emerald_local_wishes')) || [];
            renderAll();
        };

        const setupListeners = () => {
            if (!currentUser || isLocalStorageMode) return;
            
            const collRef = collection(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'items');
            const wishRef = collection(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'wishes');

            const handlePermissionDenied = (err) => {
                console.error("Firestore Permission Error, fallback to LocalStorage:", err);
                if (err.code === 'permission-denied') {
                    // 自動無縫切換，提升使用者體驗，不彈出崩潰錯誤
                    activateLocalStorageMode();
                }
            };

            unsubItems = onSnapshot(collRef, (snap) => {
                collectionData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderAll();
            }, handlePermissionDenied);

            unsubWishes = onSnapshot(wishRef, (snap) => {
                wishlistData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderAll();
            }, handlePermissionDenied);
        };

        // --- 資料儲存/更新與刪除操作 ---
        window.saveItemToFirestore = async () => {
            const btn = document.getElementById('save-item-btn');
            const name = document.getElementById('item-name').value;
            const category = document.getElementById('item-category').value;
            const price = parseFloat(document.getElementById('item-price').value) || 0;
            const rating = parseFloat(document.getElementById('item-rating').value);
            if (!name) return alert("請輸入物品名稱！");

            btn.disabled = true;
            btn.textContent = "儲存中...";

            const payload = {
                name, category, price, rating, image: base64Image, createdAt: new Date().toISOString()
            };

            if (isLocalStorageMode || !currentUser) {
                // 本地儲存模式
                payload.id = Date.now().toString();
                collectionData.push(payload);
                localStorage.setItem('emerald_local_items', JSON.stringify(collectionData));
                toggleModal('modal-add-item');
                resetItemForm();
                renderAll();
                btn.disabled = false;
                btn.textContent = "確認儲存";
            } else {
                // 雲端同步模式
                try {
                    await addDoc(collection(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'items'), payload);
                    toggleModal('modal-add-item');
                    resetItemForm();
                } catch (e) { 
                    console.error("Save Error", e);
                    alert("儲存失敗，請檢查網路連線或稍後再試。"); 
                } finally { 
                    btn.disabled = false; 
                    btn.textContent = "確認儲存"; 
                }
            }
        };

        window.saveWishToFirestore = async () => {
            const name = document.getElementById('wish-name').value;
            const target = parseFloat(document.getElementById('wish-target').value) || 0;
            if (!name || !target) return alert("請輸入完整名稱與目標金額！");

            const payload = {
                name, target, saved: 0, createdAt: new Date().toISOString()
            };

            if (isLocalStorageMode || !currentUser) {
                payload.id = Date.now().toString();
                wishlistData.push(payload);
                localStorage.setItem('emerald_local_wishes', JSON.stringify(wishlistData));
                toggleModal('modal-add-wish');
                document.getElementById('wish-name').value = '';
                document.getElementById('wish-target').value = '';
                renderAll();
            } else {
                try {
                    await addDoc(collection(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'wishes'), payload);
                    toggleModal('modal-add-wish');
                    document.getElementById('wish-name').value = '';
                    document.getElementById('wish-target').value = '';
                } catch (e) { console.error(e); }
            }
        };

        window.updateWishSaved = async (id, amount) => {
            const wishIndex = wishlistData.findIndex(w => w.id === id);
            if (wishIndex !== -1) {
                const wish = wishlistData[wishIndex];
                const newSaved = Math.max(0, wish.saved + amount);

                if (isLocalStorageMode || !currentUser) {
                    wishlistData[wishIndex].saved = newSaved;
                    localStorage.setItem('emerald_local_wishes', JSON.stringify(wishlistData));
                    renderAll();
                } else {
                    await updateDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'wishes', id), {
                        saved: newSaved
                    });
                }
            }
        };

        window.deleteFirestoreDoc = async (id, type) => {
            if (!confirm("確定要刪除嗎？")) return;
            const coll = type === 'coll' ? 'items' : 'wishes';

            if (isLocalStorageMode || !currentUser) {
                if (type === 'coll') {
                    collectionData = collectionData.filter(i => i.id !== id);
                    localStorage.setItem('emerald_local_items', JSON.stringify(collectionData));
                } else {
                    wishlistData = wishlistData.filter(w => w.id !== id);
                    localStorage.setItem('emerald_local_wishes', JSON.stringify(wishlistData));
                }
                renderAll();
            } else {
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, coll, id));
            }
        };

        window.handleLogout = async () => {
            if (isLocalStorageMode) {
                if(confirm("切換帳號將會清除目前的暫存資料，確定繼續？")) {
                    localStorage.removeItem('emerald_local_items');
                    localStorage.removeItem('emerald_local_wishes');
                    location.reload();
                }
            } else {
                await signOut(auth);
            }
        };

        // --- 渲染 UI ---
        function renderAll() {
            renderDashboard();
            renderCollectionGrid();
            renderWishlistItems();
        }

        function renderDashboard() {
            const total = collectionData.reduce((s, i) => s + (i.price || 0), 0);
            const avg = collectionData.length ? (collectionData.reduce((s, i) => s + (i.rating || 0), 0) / collectionData.length).toFixed(1) : "0.0";
            
            document.getElementById('total-value').textContent = `$${total.toLocaleString()}`;
            document.getElementById('avg-rating').textContent = avg;

            let stars = "";
            for(let i=0; i<5; i++) stars += i < Math.floor(avg) ? "★" : "☆";
            document.getElementById('avg-stars').textContent = stars;

            const cats = {};
            collectionData.forEach(i => cats[i.category] = (cats[i.category] || 0) + 1);
            updateChart(Object.keys(cats), Object.values(cats));

            const recent = [...collectionData].sort((a,b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 5);
            document.getElementById('recent-list').innerHTML = recent.map(r => `
                <div class="flex items-center gap-3 p-3 bg-white/5 rounded-xl border border-white/10">
                    <div class="w-12 h-12 rounded-lg bg-emerald-800 flex-shrink-0 flex items-center justify-center overflow-hidden">
                        ${r.image ? `<img src="${r.image}" class="w-full h-full object-cover">` : '📦'}
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="truncate font-bold text-white">${r.name}</p>
                        <p class="text-[10px] text-emerald-400 uppercase tracking-tighter">${r.category}</p>
                    </div>
                    <span class="text-emerald-400 font-mono font-bold">$${(r.price || 0).toLocaleString()}</span>
                </div>
            `).join('') || '<p class="text-center opacity-30 py-10">尚無收藏</p>';

            const topWish = [...wishlistData].sort((a,b) => b.createdAt.localeCompare(a.createdAt))[0];
            const nameEl = document.getElementById('savings-item-name');
            const barEl = document.getElementById('savings-bar');
            const statusEl = document.getElementById('savings-status');
            if(topWish) {
                const p = Math.min(100, Math.round((topWish.saved / topWish.target) * 100));
                nameEl.textContent = topWish.name;
                barEl.style.width = `${p}%`;
                statusEl.textContent = `${p}% - 已存 $${topWish.saved.toLocaleString()} / 目標 $${topWish.target.toLocaleString()}`;
            } else {
                nameEl.textContent = "無進行中項目";
                barEl.style.width = "0%";
                statusEl.textContent = "許個願望來追蹤存錢進度吧";
            }
        }

        function renderCollectionGrid() {
            const grid = document.getElementById('collection-grid');
            grid.innerHTML = collectionData.map(item => `
                <div class="glass-card overflow-hidden flex flex-col h-full group hover:border-emerald-400 transition-all">
                    <div class="h-48 bg-emerald-950/50 relative">
                        ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : '<div class="w-full h-full flex items-center justify-center text-5xl opacity-10">📦</div>'}
                        <div class="absolute top-3 right-3 bg-black/60 backdrop-blur px-2 py-1 rounded-lg text-xs font-bold text-yellow-400">★ ${item.rating}</div>
                    </div>
                    <div class="p-4 flex-1 flex flex-col">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] text-emerald-300 border border-emerald-500/50 px-2 py-0.5 rounded-full uppercase">${item.category}</span>
                            <button onclick="deleteFirestoreDoc('${item.id}', 'coll')" class="text-white/20 hover:text-red-400 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118z"/></svg>
                            </button>
                        </div>
                        <h4 class="font-bold text-lg leading-tight flex-1 text-white">${item.name}</h4>
                        <div class="mt-4 pt-3 border-t border-white/10 flex justify-between items-center">
                            <span class="text-xl font-mono text-emerald-400 font-bold">$${(item.price || 0).toLocaleString()}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderWishlistItems() {
            const cont = document.getElementById('wishlist-container');
            cont.innerHTML = wishlistData.map(w => {
                const progress = Math.min(100, (w.saved / w.target) * 100);
                return `
                <div class="glass-card p-5 relative overflow-hidden group">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex-1">
                            <h4 class="text-xl font-bold text-white">${w.name} ${progress >= 100 ? '✨' : ''}</h4>
                            <div class="text-sm text-emerald-300 mt-1 font-mono">$${w.saved.toLocaleString()} / $${w.target.toLocaleString()}</div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="updateWishSaved('${w.id}', 100)" class="bg-emerald-700/50 hover:bg-emerald-600 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors">+100</button>
                            <button onclick="updateWishSaved('${w.id}', 1000)" class="bg-emerald-600 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors">+1000</button>
                            <button onclick="deleteFirestoreDoc('${w.id}', 'wish')" class="ml-4 p-2 text-white/20 hover:text-red-400 transition-colors"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118z"/></svg></button>
                        </div>
                    </div>
                    <div class="w-full bg-black/40 h-2.5 mt-4 rounded-full overflow-hidden">
                        <div class="bg-gradient-to-r from-emerald-600 to-emerald-400 h-full transition-all duration-1000" style="width:${progress}%"></div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function updateChart(labels, values) {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            
            // 防呆處理：若完全無資料，渲染預設灰色圓餅圖，避免 Chart.js 報錯或出現空白
            let chartLabels = labels;
            let chartValues = values;
            let bgColors = ['#10b981', '#34d399', '#059669', '#047857', '#065f46'];
            
            if (labels.length === 0) {
                chartLabels = ['無收藏類別'];
                chartValues = [1];
                bgColors = ['rgba(255,255,255,0.1)'];
            }

            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: chartLabels,
                    datasets: [{ data: chartValues, backgroundColor: bgColors, borderWidth: 0 }]
                },
                options: { maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#fff', boxWidth: 12, font: { size: 10 } } } } }
            });
        }

        // --- 圖片壓縮並轉 base64 (防止文檔大小超載) ---
        document.getElementById('item-image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 500000) { 
                    alert("為了確保流暢的儲存速度，圖片大小需小於 500KB。請壓縮或更換圖片！"); 
                    this.value = ""; 
                    return; 
                }
                const reader = new FileReader();
                reader.onload = (ev) => {
                    base64Image = ev.target.result;
                    const pre = document.getElementById('image-preview');
                    pre.classList.remove('hidden');
                    pre.querySelector('img').src = base64Image;
                };
                reader.readAsDataURL(file);
            }
        });

        function resetItemForm() {
            document.getElementById('item-name').value = '';
            document.getElementById('item-price').value = '';
            document.getElementById('item-rating').value = '3.0';
            document.getElementById('rating-val').textContent = '3.0';
            document.getElementById('item-category').selectedIndex = 0;
            base64Image = "";
            document.getElementById('image-preview').classList.add('hidden');
            document.getElementById('item-image').value = "";
        }

        initAuth();
    </script>

    <script>
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById(`tab-${id}`).classList.remove('hidden');
        }
        function toggleModal(id) {
            document.getElementById(id).classList.toggle('hidden');
        }
        document.getElementById('item-rating').addEventListener('input', (e) => {
            document.getElementById('rating-val').textContent = parseFloat(e.target.value).toFixed(1);
        });
    </script>
</body>
</html>
